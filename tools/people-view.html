<!doctype html><html><head><meta charset="UTF-8"><title>People viewer</title>
<style>html,body{margin:0;background:#2a241f;overflow:hidden}#l{position:fixed;left:0;right:0;bottom:6px;color:#f3e6d0;font:12px ui-monospace,monospace;display:flex;justify-content:space-around}</style></head>
<body><div id="l"></div><script type="module">
// Preview a baked person: every clip side by side.  /tools/people-view.html?id=Male_Adult_15
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const id = new URLSearchParams(location.search).get('id') || 'Male_Adult_15';
const only = new URLSearchParams(location.search).get('clips');
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a241f);
scene.add(new THREE.HemisphereLight(0xfff2e0, 0x40342a, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(2, 5, 6); scene.add(sun);
scene.add(new THREE.GridHelper(40, 40, 0x8a7a66, 0x4a4038));
const g = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(`/assets/people/${id}.glb`);
// &pack=m|f|c plays a shared motion pack on this body
const pack = new URLSearchParams(location.search).get('pack');
const anims = pack ? (await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(`/assets/people/motions-${pack}.glb`)).animations : g.animations;
const clips = only ? anims.filter((c) => only.split(',').includes(c.name)) : anims;
const mixers = []; const gap = 1.3; const x0 = -((clips.length - 1) * gap) / 2;
document.getElementById('l').innerHTML = clips.map((c) => `<span>${c.name}</span>`).join('');
clips.forEach((c, i) => { const m = SkeletonUtils.clone(g.scene); m.position.x = x0 + i * gap; scene.add(m); const mx = new THREE.AnimationMixer(m); mx.clipAction(c).play(); mx.setTime(parseFloat(new URLSearchParams(location.search).get('t') || '1.2')); mixers.push(mx); m.traverse((o) => o.isMesh && (o.frustumCulled = false)); });
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0, 1.4, Math.max(5, clips.length * 1.15)); cam.lookAt(0, 0.95, 0);
let last = performance.now();
(function loop(now) { requestAnimationFrame(loop); const dt = (now - last) / 1000; last = now; if (!new URLSearchParams(location.search).has('freeze')) mixers.forEach((m) => m.update(dt)); r.render(scene, cam); })(last);
window.__ready = true;
</script></body></html>
